# ============ 数据库连接配置 ============
# 说明：本配置使用 Spring 占位符语法 ${ENV_VAR:默认值}
#   - 本机开发：未设置环境变量时自动用冒号后的默认值，开箱即用
#   - 服务器部署：通过环境变量 DB_HOST/DB_PORT/DB_NAME/DB_USERNAME/DB_PASSWORD 覆盖
#   - 这样 GitHub 仓库不暴露真实密码，部署时又可灵活配置
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:property_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=${DB_USERNAME:root}
jdbc.password=${DB_PASSWORD:123456}

# ============ Druid 连接池配置 ============
druid.initialSize=2
druid.minIdle=2
druid.maxActive=20
druid.maxWait=60000
druid.validationQuery=SELECT 1
druid.testWhileIdle=true
druid.testOnBorrow=false
druid.testOnReturn=false
