<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('房屋管理')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{common/layout :: sidebar('room')}"></aside>
    <main class="main">
        <header th:replace="~{common/layout :: topbar('房屋管理', '维护小区房屋档案与入住状态')}"></header>

        <div class="content">
            <div class="alert alert-success alert-auto" th:if="${msg != null}" th:text="${msg}"></div>
            <div class="alert alert-error alert-auto" th:if="${error != null}" th:text="${error}"></div>

            <div class="card">
                <div class="toolbar">
                    <form th:action="@{/room/list}" method="get">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="房号 / 楼栋 / 业主">
                        <select name="buildingId">
                            <option value="">全部楼栋</option>
                            <option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.name}"
                                    th:selected="${buildingId != null and buildingId == b.id}"></option>
                        </select>
                        <select name="status">
                            <option value="">全部状态</option>
                            <option th:each="s : ${ {'已入住','空置','装修中'} }" th:value="${s}" th:text="${s}"
                                    th:selected="${status != null and status == s}"></option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">查询</button>
                        <a class="btn btn-sm" th:href="@{/room/list}">重置</a>
                    </form>
                    <button type="button" class="btn btn-primary"
                            onclick="openCreate('dataForm', 'editPanel', '新增房屋')">+ 新增房屋</button>
                </div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>楼栋</th>
                            <th>房号</th>
                            <th>楼层</th>
                            <th>建筑面积(㎡)</th>
                            <th>房屋类型</th>
                            <th>状态</th>
                            <th>业主</th>
                            <th>业主电话</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.list.isEmpty()}">
                            <td colspan="9" class="empty-row">暂无房屋数据</td>
                        </tr>
                        <tr th:each="r : ${page.list}">
                            <td th:text="${r.buildingName}">1号楼</td>
                            <td th:text="${r.roomNo}">1-101</td>
                            <td th:text="${r.floor}">1</td>
                            <td th:text="${r.area}">89.50</td>
                            <td><span class="badge" th:text="${r.roomType}">住宅</span></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${r.status == '已入住'} ? 'badge-green' : (${r.status == '装修中'} ? 'badge-orange' : 'badge-gray')"
                                      th:text="${r.status}">已入住</span>
                            </td>
                            <td th:text="${r.ownerName != null ? r.ownerName : '—'}">张三</td>
                            <td th:text="${r.ownerPhone != null ? r.ownerPhone : '—'}">13900000001</td>
                            <td>
                                <div class="btn-row">
                                    <button type="button" class="btn btn-sm"
                                            th:attr="data-id=${r.id},data-buildingid=${r.buildingId},data-roomno=${r.roomNo},data-floor=${r.floor},data-area=${r.area},data-roomtype=${r.roomType},data-status=${r.status}"
                                            onclick="openEdit(this, 'dataForm', 'editPanel', '编辑房屋')">编辑</button>
                                    <form th:if="${loginUser.role == 'ADMIN'}" th:action="@{/room/delete}" method="post"
                                          onsubmit="return confirmSubmit('确定删除该房屋吗？');">
                                        <input type="hidden" name="id" th:value="${r.id}">
                                        <button type="submit" class="btn btn-sm btn-danger">删除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pager" th:if="${page.total > 0}">
                    <span class="pager-info">
                        共 <b th:text="${page.total}">0</b> 条记录，第 <b th:text="${page.pageNum}">1</b>/<b th:text="${page.pages}">1</b> 页
                    </span>
                    <div class="pager-btns">
                        <a class="pg" th:if="${page.hasPrev}"
                           th:href="@{/room/list(pageNum=${page.pageNum - 1}, keyword=${keyword}, buildingId=${buildingId}, status=${status})}">上一页</a>
                        <a class="pg" th:each="n : ${page.pageNumbers}" th:text="${n}"
                           th:classappend="${n == page.pageNum} ? 'active'"
                           th:href="@{/room/list(pageNum=${n}, keyword=${keyword}, buildingId=${buildingId}, status=${status})}">1</a>
                        <a class="pg" th:if="${page.hasNext}"
                           th:href="@{/room/list(pageNum=${page.pageNum + 1}, keyword=${keyword}, buildingId=${buildingId}, status=${status})}">下一页</a>
                    </div>
                </div>
            </div>

            <div class="card form-panel" id="editPanel">
                <div class="card-head">
                    <div>
                        <h3 class="panel-title">新增房屋</h3>
                        <div class="sub">同一楼栋下房号不能重复；业主绑定请在「业主管理」中办理</div>
                    </div>
                </div>
                <form id="dataForm" th:action="@{/room/save}" method="post">
                    <input type="hidden" name="id">
                    <div class="form-grid">
                        <div class="form-row">
                            <label class="required" for="buildingId">所属楼栋</label>
                            <select id="buildingId" name="buildingId" required>
                                <option value="">请选择楼栋</option>
                                <option th:each="b : ${buildings}" th:value="${b.id}" th:text="${b.name}"></option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label class="required" for="roomNo">房号</label>
                            <input type="text" id="roomNo" name="roomNo" required placeholder="如 1-101">
                        </div>
                        <div class="form-row">
                            <label for="floor">楼层</label>
                            <input type="number" id="floor" name="floor" min="1" value="1">
                        </div>
                        <div class="form-row">
                            <label class="required" for="area">建筑面积(㎡)</label>
                            <input type="number" step="0.01" id="area" name="area" required placeholder="如 89.50">
                        </div>
                        <div class="form-row">
                            <label for="roomType">房屋类型</label>
                            <select id="roomType" name="roomType">
                                <option value="住宅">住宅</option>
                                <option value="商铺">商铺</option>
                                <option value="车库">车库</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="status">房屋状态</label>
                            <select id="status" name="status">
                                <option value="空置">空置</option>
                                <option value="已入住">已入住</option>
                                <option value="装修中">装修中</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn" onclick="closePanel('editPanel')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{common/layout :: footer}"></footer>
    </main>
</div>
<script th:src="@{/static/js/app.js}"></script>
</body>
</html>
