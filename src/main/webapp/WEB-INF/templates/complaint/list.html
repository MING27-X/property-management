<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('投诉建议')}"></head>
<body>
<header th:replace="~{common/layout :: topnav('complaint')}"></header>
<div class="layout">
    <aside th:replace="~{common/layout :: sidebar('complaint')}"></aside>
    <main class="main">
        <header th:replace="~{common/layout :: topbar('投诉建议', '业主诉求受理与物业回复')}"></header>

        <div class="content">
            <div class="alert alert-success alert-auto" th:if="${msg != null}" th:text="${msg}"></div>
            <div class="alert alert-error alert-auto" th:if="${error != null}" th:text="${error}"></div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon orange">📮</div>
                    <div>
                        <div class="stat-value" th:text="${pendingCount}">0</div>
                        <div class="stat-label">待处理诉求</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">💬</div>
                    <div>
                        <div class="stat-value" th:text="${repliedCount}">0</div>
                        <div class="stat-label">已回复诉求</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple">📋</div>
                    <div>
                        <div class="stat-value" th:text="${page.total}">0</div>
                        <div class="stat-label">当前筛选记录</div>
                    </div>
                </div>
            </div>

            <div class="tabs">
                <a th:href="@{/complaint/list(type=${type})}"
                   th:classappend="${status == null or status == ''} ? 'active'">全部</a>
                <a th:href="@{/complaint/list(status='待处理', type=${type})}"
                   th:classappend="${status == '待处理'} ? 'active'">待处理<span
                        class="tab-count" th:if="${loginUser.role != 'OWNER'}"
                        th:text="'(' + ${pendingCount} + ')'"></span></a>
                <a th:href="@{/complaint/list(status='已回复', type=${type})}"
                   th:classappend="${status == '已回复'} ? 'active'">已回复<span
                        class="tab-count" th:if="${loginUser.role != 'OWNER'}"
                        th:text="'(' + ${repliedCount} + ')'"></span></a>
            </div>

            <div class="card">
                <div class="toolbar">
                    <form th:action="@{/complaint/list}" method="get">
                        <input type="text" th:if="${loginUser.role != 'OWNER'}" name="keyword"
                               th:value="${keyword}" placeholder="标题 / 内容 / 业主">
                        <select name="type">
                            <option value="">全部类型</option>
                            <option value="投诉" th:selected="${type == '投诉'}">投诉</option>
                            <option value="建议" th:selected="${type == '建议'}">建议</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">查询</button>
                        <a class="btn btn-sm" th:href="@{/complaint/list}">重置</a>
                    </form>
                    <button type="button" class="btn btn-primary"
                            onclick="openCreate('dataForm', 'editPanel', '提交投诉或建议')">
                        + <span th:text="${loginUser.role == 'OWNER' ? '我要投诉 / 建议' : '代业主录入'}">我要投诉 / 建议</span>
                    </button>
                </div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>编号</th>
                            <th th:if="${loginUser.role != 'OWNER'}">提交业主</th>
                            <th th:if="${loginUser.role != 'OWNER'}">所在房屋</th>
                            <th>类型</th>
                            <th>标题</th>
                            <th>状态</th>
                            <th>提交时间</th>
                            <th>回复时间</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.list.isEmpty()}">
                            <td colspan="9" class="empty-row">暂无投诉建议记录</td>
                        </tr>
                        <tr th:each="c : ${page.list}">
                            <td th:text="'#' + ${c.id}">#1</td>
                            <td th:if="${loginUser.role != 'OWNER'}" th:text="${c.ownerName}">张三</td>
                            <td th:if="${loginUser.role != 'OWNER'}"
                                th:text="${(c.buildingName != null ? c.buildingName : '') + ' ' + (c.roomNo != null ? c.roomNo : '')}">1号楼 1-101</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${c.type == '投诉'} ? 'badge-orange' : 'badge-blue'"
                                      th:text="${c.type}">投诉</span>
                            </td>
                            <td class="wrap"><a th:href="@{/complaint/detail(id=${c.id})}" th:text="${c.title}">标题</a></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${c.status == '待处理'} ? 'badge-orange' : 'badge-green'"
                                      th:text="${c.status}">待处理</span>
                            </td>
                            <td th:text="${#dates.format(c.createTime, 'yyyy-MM-dd HH:mm')}">2026-03-04 22:40</td>
                            <td th:text="${c.replyTime != null ? #dates.format(c.replyTime,'yyyy-MM-dd HH:mm') : '—'}">—</td>
                            <td>
                                <div class="btn-row">
                                    <a class="btn btn-sm" th:href="@{/complaint/detail(id=${c.id})}">
                                        <span th:text="${loginUser.role == 'OWNER' ? '查看' : '查看 / 回复'}">查看</span>
                                    </a>
                                    <form th:if="${loginUser.role == 'ADMIN'}" th:action="@{/complaint/delete}" method="post"
                                          onsubmit="return confirmSubmit('确定删除该记录吗？');">
                                        <input type="hidden" name="id" th:value="${c.id}">
                                        <button type="submit" class="btn btn-sm btn-danger">删除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pager" th:if="${page.total > 0}">
                    <span class="pager-info">
                        共 <b th:text="${page.total}">0</b> 条记录，第 <b th:text="${page.pageNum}">1</b>/<b th:text="${page.pages}">1</b> 页
                    </span>
                    <div class="pager-btns">
                        <a class="pg" th:if="${page.hasPrev}"
                           th:href="@{/complaint/list(pageNum=${page.pageNum - 1}, keyword=${keyword}, type=${type}, status=${status})}">上一页</a>
                        <a class="pg" th:each="n : ${page.pageNumbers}" th:text="${n}"
                           th:classappend="${n == page.pageNum} ? 'active'"
                           th:href="@{/complaint/list(pageNum=${n}, keyword=${keyword}, type=${type}, status=${status})}">1</a>
                        <a class="pg" th:if="${page.hasNext}"
                           th:href="@{/complaint/list(pageNum=${page.pageNum + 1}, keyword=${keyword}, type=${type}, status=${status})}">下一页</a>
                    </div>
                </div>
            </div>

            <div class="card form-panel" id="editPanel">
                <div class="card-head">
                    <div>
                        <h3 class="panel-title">提交投诉或建议</h3>
                        <div class="sub">物业服务中心将在 1-3 个工作日内回复处理结果</div>
                    </div>
                </div>
                <form id="dataForm" th:action="@{/complaint/save}" method="post">
                    <div class="form-grid">
                        <div class="form-row" th:if="${loginUser.role != 'OWNER'}">
                            <label class="required" for="ownerId">提交业主</label>
                            <select id="ownerId" name="ownerId" required>
                                <option value="">请选择业主</option>
                                <option th:each="o : ${owners}" th:value="${o.id}" th:text="${o.label}"></option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="type">类型</label>
                            <select id="type" name="type">
                                <option value="投诉">投诉</option>
                                <option value="建议">建议</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label class="required" for="title">标题</label>
                            <input type="text" id="title" name="title" required placeholder="如 楼下商铺夜间噪音扰民">
                        </div>
                    </div>
                    <div class="form-row">
                        <label class="required" for="content">详细内容</label>
                        <textarea id="content" name="content" required
                                  placeholder="请描述具体情况，便于物业核实处理"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">提交</button>
                        <button type="button" class="btn" onclick="closePanel('editPanel')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{common/layout :: footer}"></footer>
    </main>
</div>
<script th:src="@{/static/js/app.js}"></script>
</body>
</html>
