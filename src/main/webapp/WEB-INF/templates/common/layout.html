<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!--
  公共布局片段：
    head(title)            页面头部，引入样式表
    sidebar(active)        左侧导航（物业端/管理员）或顶部导航（业主端）
    topbar(title, sub)     页面标题栏
    footer                 页脚
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 智慧物业社区管理系统'">智慧物业社区管理系统</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
</head>
<body>

<!-- ==================== 顶部导航（业主端） ==================== -->
<header class="topnav" th:fragment="topnav(active)"
        th:if="${loginUser != null and loginUser.role == 'OWNER'}">
    <div class="topnav-brand">智慧物业社区管理系统</div>
    <nav class="topnav-menu">
        <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">首页</a>
        <a th:href="@{/notice/list}" th:classappend="${active == 'notice'} ? 'active'">公告通知</a>
        <a th:href="@{/owner/my}" th:classappend="${active == 'owner'} ? 'active'">我的房屋</a>
        <a th:href="@{/repair/list}" th:classappend="${active == 'repair'} ? 'active'">我的报修</a>
        <a th:href="@{/fee/list}" th:classappend="${active == 'fee'} ? 'active'">我的缴费</a>
        <a th:href="@{/complaint/list}" th:classappend="${active == 'complaint'} ? 'active'">我的投诉</a>
    </nav>
    <div class="topnav-right">
        <span class="bell" title="消息通知">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
        </span>
        <div class="avatar-menu">
            <div class="avatar" th:text="${#strings.substring(loginUser.realName, 0, 1)}">业</div>
            <span class="avatar-name" th:text="${loginUser.realName}">业主</span>
            <div class="dropdown">
                <a th:href="@{/profile}">个人中心</a>
                <a th:href="@{/logout}" onclick="return confirm('确定要退出登录吗？');">退出登录</a>
            </div>
        </div>
    </div>
</header>

<!-- ==================== 左侧导航（物业员工 / 系统管理员） ==================== -->
<aside class="sidebar" th:fragment="sidebar(active)"
       th:if="${loginUser != null and loginUser.role != 'OWNER'}">
    <div class="sidebar-brand">
            <div class="logo">智</div>
            <div class="brand-text">
                <h1>智慧物业社区管理系统</h1>
                <span>Smart Property</span>
            </div>
    </div>

    <nav class="sidebar-menu">
            <div class="sidebar-group">控制台</div>
            <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'">
                <span class="ico">🏠</span><span>控制台</span>
            </a>

            <div class="sidebar-group">小区管理</div>
            <a th:href="@{/building/list}" th:classappend="${active == 'building'} ? 'active'">
                <span class="ico">🏢</span><span>楼栋管理</span>
            </a>
            <a th:href="@{/room/list}" th:classappend="${active == 'room'} ? 'active'">
                <span class="ico">🚪</span><span>房屋管理</span>
            </a>
            <a th:href="@{/owner/list}" th:classappend="${active == 'owner'} ? 'active'">
                <span class="ico">🧑‍🤝‍🧑</span><span>业主管理</span>
            </a>
            <a th:href="@{/parking/list}" th:classappend="${active == 'parking'} ? 'active'">
                <span class="ico">🅿️</span><span>停车管理</span>
            </a>
            <a th:href="@{/visitor/list}" th:classappend="${active == 'visitor'} ? 'active'">
                <span class="ico">🚶</span><span>访客管理</span>
            </a>

            <div class="sidebar-group">社区服务</div>
            <a th:href="@{/fee/list}" th:classappend="${active == 'fee'} ? 'active'">
                <span class="ico">💰</span><span>缴费管理</span>
            </a>
            <a th:href="@{/repair/list}" th:classappend="${active == 'repair'} ? 'active'">
                <span class="ico">🛠️</span><span>报修处理</span>
            </a>
            <a th:href="@{/complaint/list}" th:classappend="${active == 'complaint'} ? 'active'">
                <span class="ico">💬</span><span>投诉建议</span>
            </a>
            <a th:href="@{/notice/list}" th:classappend="${active == 'notice'} ? 'active'">
                <span class="ico">📢</span><span>公告发布</span>
            </a>

            <div class="sidebar-group" th:if="${loginUser.role == 'ADMIN'}">系统管理</div>
            <a th:if="${loginUser.role == 'ADMIN'}" th:href="@{/user/list}"
               th:classappend="${active == 'user'} ? 'active'">
                <span class="ico">👤</span><span>用户管理</span>
            </a>
    </nav>

    <div class="sidebar-foot">
            <a th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'active'">
                <span class="ico">⚙️</span><span>个人中心</span>
            </a>
            <a th:href="@{/logout}" onclick="return confirm('确定要退出登录吗？');">
                <span class="ico">⏻</span><span>退出登录</span>
            </a>
    </div>
</aside>

<!-- ==================== 页面标题栏 ==================== -->
<header class="topbar" th:fragment="topbar(title, sub)">
    <div class="topbar-title">
        <div class="crumb" th:if="${title != '首页概览'}">
            <a th:href="@{/dashboard}">首页</a>
            <span class="sep">/</span>
            <span th:text="${title}">当前页面</span>
        </div>
        <h2 th:text="${title}">标题</h2>
        <p th:text="${sub}">副标题</p>
    </div>
    <div class="topbar-user" th:if="${loginUser != null and loginUser.role != 'OWNER'}">
        <div class="avatar" th:text="${#strings.substring(loginUser.realName, 0, 1)}">用</div>
        <div class="user-meta">
            <strong th:text="${loginUser.realName}">用户</strong>
            <span th:text="${loginUser.roleName}">角色</span>
        </div>
        <a class="btn btn-sm" th:href="@{/profile}">个人中心</a>
    </div>
</header>

<!-- ==================== 页脚 ==================== -->
<footer class="footer" th:fragment="footer">
    <span>智慧物业社区管理系统 v1.0.0</span>
</footer>

</body>
</html>
