<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('停车位管理')}"></head>
<body>
<div class="layout">
    <aside th:replace="~{common/layout :: sidebar('parking')}"></aside>
    <main class="main">
        <header th:replace="~{common/layout :: topbar('停车位管理', '车位档案、租用与退租办理')}"></header>

        <div class="content">
            <div class="alert alert-success alert-auto" th:if="${msg != null}" th:text="${msg}"></div>
            <div class="alert alert-error alert-auto" th:if="${error != null}" th:text="${error}"></div>

            <div class="stat-grid">
                <div class="stat-card">
                    <div class="stat-icon">🅿️</div>
                    <div>
                        <div class="stat-value" th:text="${totalCount}">0</div>
                        <div class="stat-label">车位总数</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <div>
                        <div class="stat-value" th:text="${freeCount}">0</div>
                        <div class="stat-label">空闲车位</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🚗</div>
                    <div>
                        <div class="stat-value" th:text="${rentedCount}">0</div>
                        <div class="stat-label">已租用车位</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">💰</div>
                    <div>
                        <div class="stat-value" th:text="${monthlyIncome} + ' 元'">0</div>
                        <div class="stat-label">月租金收入</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="toolbar">
                    <form th:action="@{/parking/list}" method="get">
                        <input type="text" name="keyword" th:value="${keyword}" placeholder="车位编号 / 车牌 / 业主">
                        <select name="status">
                            <option value="">全部状态</option>
                            <option th:each="s : ${ {'空闲','已租用','临时占用'} }" th:value="${s}" th:text="${s}"
                                    th:selected="${status == s}"></option>
                        </select>
                        <select name="type">
                            <option value="">全部类型</option>
                            <option value="固定" th:selected="${type == '固定'}">固定</option>
                            <option value="临时" th:selected="${type == '临时'}">临时</option>
                        </select>
                        <button type="submit" class="btn btn-primary btn-sm">查询</button>
                        <a class="btn btn-sm" th:href="@{/parking/list}">重置</a>
                    </form>
                    <button type="button" class="btn btn-primary"
                            onclick="openCreate('dataForm', 'editPanel', '新增车位')">+ 新增车位</button>
                </div>

                <div class="table-wrap">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>车位编号</th>
                            <th>所在区域</th>
                            <th>类型</th>
                            <th>状态</th>
                            <th>租用业主</th>
                            <th>车牌号</th>
                            <th>月租金</th>
                            <th>租期</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${page.list.isEmpty()}">
                            <td colspan="9" class="empty-row">暂无车位数据</td>
                        </tr>
                        <tr th:each="p : ${page.list}">
                            <td><span class="badge badge-blue" th:text="${p.spaceNo}">B1-001</span></td>
                            <td th:text="${p.area}">地下车库A区</td>
                            <td th:text="${p.type}">固定</td>
                            <td>
                                <span class="badge"
                                      th:classappend="${p.status == '空闲'} ? 'badge-green' : (${p.status == '已租用'} ? 'badge-blue' : 'badge-orange')"
                                      th:text="${p.status}">空闲</span>
                            </td>
                            <td th:text="${p.ownerName != null ? p.ownerName : '—'}">张三</td>
                            <td th:text="${p.plateNo != null ? p.plateNo : '—'}">沪A12345</td>
                            <td th:text="${p.monthlyFee} + ' 元'">300</td>
                            <td>
                                <span th:if="${p.rentStart != null}"
                                      th:text="${#dates.format(p.rentStart,'yyyy-MM-dd')} + ' 至 ' + ${#dates.format(p.rentEnd,'yyyy-MM-dd')}">租期</span>
                                <span th:if="${p.rentStart == null}">—</span>
                            </td>
                            <td>
                                <div class="btn-row">
                                    <button type="button" class="btn btn-sm btn-success" th:if="${p.status != '已租用'}"
                                            th:attr="data-id=${p.id},data-spaceno=${p.spaceNo}"
                                            onclick="openEdit(this, 'rentForm', 'rentPanel', '车位租用办理')">租用</button>
                                    <form th:if="${p.status == '已租用'}" th:action="@{/parking/release}" method="post"
                                          onsubmit="return confirmSubmit('确定办理退租吗？');">
                                        <input type="hidden" name="id" th:value="${p.id}">
                                        <button type="submit" class="btn btn-sm">退租</button>
                                    </form>
                                    <button type="button" class="btn btn-sm"
                                            th:attr="data-id=${p.id},data-spaceno=${p.spaceNo},data-area=${p.area},data-type=${p.type},data-status=${p.status},data-monthlyfee=${p.monthlyFee}"
                                            onclick="openEdit(this, 'dataForm', 'editPanel', '编辑车位')">编辑</button>
                                    <form th:if="${loginUser.role == 'ADMIN'}" th:action="@{/parking/delete}" method="post"
                                          onsubmit="return confirmSubmit('确定删除该车位吗？');">
                                        <input type="hidden" name="id" th:value="${p.id}">
                                        <button type="submit" class="btn btn-sm btn-danger">删除</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="pager" th:if="${page.total > 0}">
                    <span class="pager-info">
                        共 <b th:text="${page.total}">0</b> 个车位，第 <b th:text="${page.pageNum}">1</b>/<b th:text="${page.pages}">1</b> 页
                    </span>
                    <div class="pager-btns">
                        <a class="pg" th:if="${page.hasPrev}"
                           th:href="@{/parking/list(pageNum=${page.pageNum - 1}, keyword=${keyword}, status=${status}, type=${type})}">上一页</a>
                        <a class="pg" th:each="n : ${page.pageNumbers}" th:text="${n}"
                           th:classappend="${n == page.pageNum} ? 'active'"
                           th:href="@{/parking/list(pageNum=${n}, keyword=${keyword}, status=${status}, type=${type})}">1</a>
                        <a class="pg" th:if="${page.hasNext}"
                           th:href="@{/parking/list(pageNum=${page.pageNum + 1}, keyword=${keyword}, status=${status}, type=${type})}">下一页</a>
                    </div>
                </div>
            </div>

            <!-- 车位租用办理 -->
            <div class="card form-panel" id="rentPanel">
                <div class="card-head">
                    <div>
                        <h3 class="panel-title">车位租用办理</h3>
                        <div class="sub">租期默认自办理之日起一年，费用按 T_parking 表中的月租金计算</div>
                    </div>
                </div>
                <form id="rentForm" th:action="@{/parking/rent}" method="post">
                    <input type="hidden" name="id">
                    <div class="form-grid">
                        <div class="form-row">
                            <label class="required" for="rentOwnerId">租用业主</label>
                            <select id="rentOwnerId" name="ownerId" required>
                                <option value="">请选择业主</option>
                                <option th:each="o : ${owners}" th:value="${o.id}" th:text="${o.label}"></option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label class="required" for="plateNo">车牌号</label>
                            <input type="text" id="plateNo" name="plateNo" required placeholder="如 沪A12345">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-success">确认租用</button>
                        <button type="button" class="btn" onclick="closePanel('rentPanel')">取消</button>
                    </div>
                </form>
            </div>

            <!-- 新增 / 编辑车位 -->
            <div class="card form-panel" id="editPanel">
                <div class="card-head">
                    <div>
                        <h3 class="panel-title">新增车位</h3>
                        <div class="sub">车位编号需唯一，例如 B1-001、G-001</div>
                    </div>
                </div>
                <form id="dataForm" th:action="@{/parking/save}" method="post">
                    <input type="hidden" name="id">
                    <div class="form-grid">
                        <div class="form-row">
                            <label class="required" for="spaceNo">车位编号</label>
                            <input type="text" id="spaceNo" name="spaceNo" required placeholder="如 B1-001">
                        </div>
                        <div class="form-row">
                            <label for="area">所在区域</label>
                            <input type="text" id="area" name="area" value="地下车库A区" placeholder="如 地下车库A区">
                        </div>
                        <div class="form-row">
                            <label for="type">车位类型</label>
                            <select id="type" name="type">
                                <option value="固定">固定</option>
                                <option value="临时">临时</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="status">车位状态</label>
                            <select id="status" name="status">
                                <option value="空闲">空闲</option>
                                <option value="已租用">已租用</option>
                                <option value="临时占用">临时占用</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <label for="monthlyFee">月租金(元)</label>
                            <input type="number" step="0.01" id="monthlyFee" name="monthlyFee" value="300">
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn" onclick="closePanel('editPanel')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <footer th:replace="~{common/layout :: footer}"></footer>
    </main>
</div>
<script th:src="@{/static/js/app.js}"></script>
</body>
</html>
